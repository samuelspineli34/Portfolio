<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Spineli | Software Developer</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="icon" type="image/png" href="/logo.png">

    <script>
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <header
        class="fixed top-0 z-50 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex flex-col">
                <span class="font-black text-xl tracking-tighter">SAMUEL SPINELI</span>
                <span class="text-[10px] font-bold text-blue-600 tracking-[0.2em]" data-i18n="nav-role"></span>
            </div>
            <div class="flex items-center gap-6">
                <nav
                    class="hidden lg:flex gap-8 text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400">
                    <a href="#about" data-i18n="nav-about"></a>
                    <a href="#experience" data-i18n="nav-exp"></a>
                    <a href="#projects" data-i18n="nav-projects"></a>
                </nav>
                <div class="flex items-center gap-6 border-l pl-6 border-slate-200 dark:border-slate-700">
                    <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800"><span
                            id="theme-icon"></span></button>
                    <div class="flex gap-2">
                        <button onclick="setLanguage('pt')" id="btn-pt" class="flag-btn active"><img
                                src="https://flagcdn.com/w40/br.png" width="22"></button>
                        <button onclick="setLanguage('en')" id="btn-en" class="flag-btn"><img
                                src="https://flagcdn.com/w40/gb.png" width="22"></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section id="about" class="pt-40 pb-20 bg-white dark:bg-slate-900 transition-colors">
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-16 items-center">
            <div class="lg:col-span-4 flex justify-center">
                <!-- Ajustado caminho da imagem -->
                <img src="/imagens/eu.jpg"
                    class="w-72 h-80 object-cover rounded-2xl shadow-2xl border-4 border-slate-50 dark:border-slate-800">
            </div>
            <div class="lg:col-span-8">
                <h1 class="text-6xl font-black mb-4">Samuel Spineli</h1>
                <p class="text-2xl text-blue-600 font-bold mb-8 uppercase tracking-wide" data-i18n="nav-role"></p>
                <div class="text-lg text-slate-600 dark:text-slate-400 leading-relaxed mb-10" data-i18n="hero-summary">
                </div>
                <div id="tech-stack" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </section>

    <section id="experience" class="py-24 bg-slate-50 dark:bg-slate-950">
        <div class="max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-20">
            <div class="lg:col-span-7">
                <h3 class="text-3xl font-black mb-12 uppercase" data-i18n="section-exp"></h3>
                <div id="experience-list" class="space-y-12 border-l-2 border-slate-200 dark:border-slate-800 ml-4">
                </div>
            </div>
            <!-- EXPERIENCE -->
            <div class="lg:col-span-5">
                <h3 class="text-3xl font-black mb-12 uppercase tracking-tighter" data-i18n="section-edu"></h3>
                <div
                    class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center text-center">
                    <img src="/imagens/puc.png" alt="PUC Minas" class="w-24 pb-1 dark:brightness-200">
                    <p class="text-blue-600 font-bold text-sm uppercase tracking-wider" data-i18n="edu-degree"></p>
                    <p class="text-slate-400 text-sm mt-2 font-medium">2020 — 2025</p>
                    <p class="text-slate-500 text-xs mt-4">Belo Horizonte, MG</p>
                </div>
            </div>
        </div>
    </section>

    <section id="projects" class="py-24 bg-white dark:bg-slate-900">
        <div class="max-w-7xl mx-auto px-6">
            <h3 class="text-4xl font-black text-center mb-20 uppercase" data-i18n="section-projects"></h3>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </section>

    <footer id="contact" class="py-24 bg-slate-950 text-white">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <h3 class="text-4xl font-black mb-12" data-i18n="footer-contact"></h3>
            <div class="flex flex-wrap justify-center gap-10 font-bold text-slate-400 uppercase tracking-widest mb-10">
                <a href="mailto:samuelspinelli34@gmail.com" class="hover:text-blue-500">Email</a>
                <a href="https://linkedin.com/in/samuel-spineli" class="hover:text-blue-500">LinkedIn</a>
                <a href="https://github.com/samuelspineli34" class="hover:text-blue-500">GitHub</a>
            </div>
            <p class="text-[10px] text-slate-600 tracking-[0.5em]">© 2026 SAMUEL SPINELI</p>
        </div>
    </footer>

    <!-- CORREÇÃO: type="module" e caminho absoluto /src/ -->
    <script type="module" src="/src/app.ts"></script>
</body>

</html>
